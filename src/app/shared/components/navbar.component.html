<header class="border-b border-[#23283c] bg-[#06070b]/90 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    
    <!-- Logo & Brand (Clickable to return to Catalog) -->
    <div (click)="goToCatalog()" class="flex items-center gap-3 cursor-pointer group">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[var(--color-blue)] to-[#325287] flex items-center justify-center shadow-lg shadow-[var(--color-blue)]/20 font-mono font-extrabold text-white text-lg group-hover:scale-105 transition-transform">
        AT
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-base sm:text-lg font-bold text-white tracking-tight group-hover:text-[var(--color-blue)] transition-colors">
            AlgorithmTracker
          </span>
        </div>
        <p class="text-[11px] text-[#828c9b]">مختبر مرئي لخوارزميات الترتيب</p>
      </div>
    </div>

    <!-- Actions / View Navigation -->
    <div class="flex items-center gap-2.5">
      @if (activeView() === 'visualizer') {
        <button
          (click)="goToCatalog()"
          class="px-3 py-1.5 rounded-xl bg-[#0e111a] hover:bg-[#141724] border border-[#23283c] text-xs font-semibold text-[#c9d2dc] transition-all flex items-center gap-1.5 font-arabic active:scale-95"
        >
          <span>⤶</span>
          <span>كل الخوارزميات</span>
        </button>

        <span class="px-3 py-1.5 text-xs font-bold rounded-xl bg-[#0e111a] text-[var(--color-blue)] border border-[var(--color-blue)]/30 hidden sm:flex items-center gap-1.5 font-arabic">
          <span class="w-2 h-2 rounded-full bg-[var(--color-green)]"></span>
          {{ currentAlgorithm().metadata.nameAr }}
        </span>
      } @else {
        <span class="px-3 py-1.5 text-xs font-bold rounded-xl bg-[#0e111a] text-[var(--color-blue)] border border-[#23283c] flex items-center gap-2 font-arabic">
          <span class="w-2 h-2 rounded-full bg-[var(--color-blue)] animate-pulse"></span>
          الرئيسية
        </span>
      }
    </div>

  </div>
</header>
