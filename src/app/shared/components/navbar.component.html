<header class="border-b border-[#23283c] bg-[#06070b]/90 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    
    <!-- Logo & Brand (Clickable to return to Chapters) -->
    <div (click)="goToChapters()" class="flex items-center gap-3 cursor-pointer group">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-(--color-blue) to-[#325287] flex items-center justify-center shadow-lg shadow-(--color-blue)/20 font-mono font-extrabold text-white text-lg group-hover:scale-105 transition-transform">
        AT
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-base sm:text-lg font-bold text-white tracking-tight group-hover:text-(--color-blue) transition-colors">
            AlgorithmTracker
          </span>
        </div>
        <p class="text-[11px] text-[#828c9b]">مختبر مرئي لخوارزميات الترتيب</p>
      </div>
    </div>

    <!-- Actions / View Navigation -->
    <div class="flex items-center gap-2">
      <!-- Exam Button (Always available) -->
      <button
        (click)="goToExam()"
        [class.bg-(--color-blue)]="activeView() === 'exam'"
        [class.text-white]="activeView() === 'exam'"
        [class.border-(--color-blue)/40]="activeView() === 'exam'"
        [class.bg-charcoal-850]="activeView() !== 'exam'"
        [class.text-silver-300]="activeView() !== 'exam'"
        class="px-2.5 sm:px-3 py-1.5 rounded-xl border border-charcoal-border hover:border-(--color-blue)/60 text-xs font-bold transition-all flex items-center gap-1.5 active:scale-95">
        <span class="text-xs">📝</span>
        <span class="font-arabic">امتحان الميد</span>
        <span class="text-[10px] font-mono px-1 rounded bg-charcoal-950 text-(--color-green)">Mid 1</span>
      </button>

      @if (activeView() === 'visualizer') {
        <button
          (click)="goToCurrentChapter()"
          class="px-2.5 sm:px-3 py-1.5 rounded-xl bg-charcoal-850 hover:bg-charcoal-800 border border-charcoal-border text-xs font-semibold text-silver-300 transition-all flex items-center gap-1 font-arabic active:scale-95">
          <span>&larr;</span>
          <span>الفصل {{ engine.selectedChapterNumber() }}</span>
        </button>

        <button
          (click)="goToChapters()"
          class="px-2.5 sm:px-3 py-1.5 rounded-xl bg-charcoal-950 hover:bg-charcoal-850 border border-charcoal-border text-xs font-semibold text-[#828c9b] hover:text-white transition-all flex items-center gap-1 font-arabic active:scale-95">
          <span>الفصول</span>
        </button>

        <span class="px-3 py-1.5 text-xs font-bold rounded-xl bg-charcoal-850 text-(--color-blue) border border-(--color-blue)/30 hidden md:flex items-center gap-1.5 font-arabic">
          <span class="w-2 h-2 rounded-full bg-(--color-green)"></span>
          {{ currentAlgorithm().metadata.nameAr }}
        </span>
      } @else if (activeView() === 'chapter-hub') {
        <button
          (click)="goToChapters()"
          class="px-3 py-1.5 rounded-xl bg-charcoal-850 hover:bg-charcoal-800 border border-charcoal-border text-xs font-semibold text-silver-300 transition-all flex items-center gap-1.5 font-arabic active:scale-95">
          <span>&larr;</span>
          <span>كل الفصول (All Chapters)</span>
        </button>
      } @else {
        <span class="px-3 py-1.5 text-xs font-bold rounded-xl bg-charcoal-850 text-(--color-blue) border border-charcoal-border flex items-center gap-2 font-arabic">
          <span class="w-2 h-2 rounded-full bg-(--color-blue) animate-pulse"></span>
          فصول المنهج
        </span>
      }
    </div>

  </div>
</header>
